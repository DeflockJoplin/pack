[package]
name = "pack"
version = "0.1.0"
edition = "2021"
description = "PACK wardriving daemon: WiFi/BLE capture, dashboard, uploads (see docs/PLAN.md)"
license = "MIT"
license-file = "../LICENSE"
build = "build.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
bluer = { version = "0.17.4", features = ["bluetoothd"] }
chrono = { version = "0.4.44", features = ["clock"] }
crossbeam-channel = "0.5.15"
csv = "1.3"
futures = { version = "0.3.32", features = ["std"] }
indexmap = "2.14.0"
pcap = "2.4.0"
radiotap = "1.3.0"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.13.3", features = ["blocking", "multipart", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["time"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_urlencoded = "0.7"
